name: Continuous Integration

on:
  push:
    branches:
      - master
  pull_request:

env:
  EXTNAME: WikiExtensions
  MW_INSTALL_PATH: ${{ github.workspace }}

jobs:
  style-php:
    name: Code Style (PHP)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4' ]
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl
          coverage: none
          tools: composer, phplint

      - name: Setup Extension
        uses: actions/checkout@v5

      - name: Setup Composer
        run: composer update

      - name: Lint
        run: phplint -w --exclude=vendor

      - name: PHP Code Sniffer
        run: vendor/bin/phpcs -sp --standard=.phpcs.xml .

  security:
    name: Static Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4' ]
        mediawiki: [ REL1_35 ]
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, ast
          coverage: none
          tools: composer

      - name: Setup MediaWiki
        uses: actions/checkout@v5
        with:
          repository: wikimedia/mediawiki
          ref: ${{ matrix.mediawiki }}

      - name: Setup Extension
        uses: actions/checkout@v5
        with:
          path: extensions/${{ env.EXTNAME }}

      - name: Setup Composer
        run: |
          echo '{"extra":{"merge-plugin":{"include":["extensions/*/composer.json","skins/*/composer.json"]}}}' > composer.local.json
          composer update
          composer update

      - name: Phan
        run: ./vendor/bin/phan -d extensions/${{ env.EXTNAME }} --minimum-target-php-version=7.4 --long-progress-bar

  npm:
    name: NPM linting and tests
    runs-on: ubuntu-latest
    steps:
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Extension
        uses: actions/checkout@v5

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  test:
    name: PHPUnit
    runs-on: ubuntu-latest
    env:
      MW_INSTALL_PATH: ${{ github.workspace }}/mediawiki
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4' ]
        mediawiki: [ REL1_35 ]
    steps:
      - name: Setup Extension
        uses: actions/checkout@v5
        with:
          # We want the WikiExtensions repo to be treated as inaccessible to
          # be able to test failure scenarios
          persist-credentials: false

      - name: Setup test extension - examples
        uses: actions/checkout@v6
        with:
          repository: wikimedia/mediawiki-extensions-examples
          path: ${{ github.workspace }}/examples
          ref: REL1_35
          fetch-depth: 10

      # Examples is pinned to using minus-x 1.1.0, we use 1.1.3, and our
      # phpunit action loads all dev dependencies of extensions; just delete all
      # of examples'
      - name: examples - remove composer.json dev dependencies
        working-directory: ${{ github.workspace }}/examples
        run: jq 'delpaths([["require-dev"]])' composer.json > composer.json.tmp && mv composer.json.tmp composer.json
  
      - name: Mediawiki PHPUnit
        uses: wikiteq/mediawiki-phpunit-action@master
        with:
          type: extension
          php: ${{ matrix.php }}
          mwbranch: ${{ matrix.mediawiki }}
          extension: ${{ env.EXTNAME }}
          extra_file: .github/PHPUnitSettings.php
